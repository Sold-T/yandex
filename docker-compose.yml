version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kedrovdb
      POSTGRES_USER: kedrov
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/backup:/backup
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kedrov -d kedrovdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: maxkedroff2005/yandexbackend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "True"
      DB_NAME: kedrovdb
      DB_USER: kedrov
      DB_PASSWORD: mypassword
      DB_HOST: postgres
      DB_PORT: 5432
      SECRET_KEY: dev-secret-key-change-in-production
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: maxkedroff2005/yandexfrontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: